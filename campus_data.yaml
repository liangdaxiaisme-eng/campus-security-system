# 校园智能安全管理系统 - 终极合并数据集
train: ./campus_security_master/train/images
val: ./campus_security_master/valid/images

# 我们最终映射出了 7 个核心类别
nc: 7

names:
  0: 'stranger'               # 外来人员/行人
  1: 'no_helmet'              # 未戴安全帽
  2: 'helmet'                 # 正常戴安全帽
  3: 'fire_hydrant'           # 消防栓
  4: 'stranger_vehicle'       # 外来车辆
  5: 'abnormal_behavior'      # 异常行为(打架)
  6: 'missing_extinguisher'   # 灭火器