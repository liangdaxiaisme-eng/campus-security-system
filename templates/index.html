<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能校园安全管理系统 | Campus Guard AI</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #111827;
            --bg-card-hover: #1a2332;
            --border: #1e293b;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.3);
            --accent: #06b6d4;
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.3);
            --success: #10b981;
            --warning: #f59e0b;
            --text: #e2e8f0;
            --text-dim: #64748b;
            --text-bright: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== 顶栏 ========== */
        .topbar {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--text-bright), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .logo-sub {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar-right a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }
        .topbar-right a:hover { color: var(--text); }
        .user-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-dim);
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255,255,255,0.04);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--success);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
        }

        .time-display {
            font-size: 14px;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }

        /* ========== 统计卡片 ========== */
        .stats-row {
            display: flex;
            gap: 12px;
            padding: 12px 32px;
            overflow-x: auto;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            flex: 1;
            min-width: 160px;
        }

        .stat-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .stat-card:nth-child(1)::before { background: linear-gradient(90deg, var(--primary), var(--accent)); }
        .stat-card:nth-child(2)::before { background: linear-gradient(90deg, var(--success), #34d399); }
        .stat-card:nth-child(3)::before { background: linear-gradient(90deg, var(--warning), #fbbf24); }
        .stat-card:nth-child(4)::before { background: linear-gradient(90deg, var(--danger), #f87171); }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .stat-card:nth-child(1) .stat-icon { background: rgba(59,130,246,0.15); color: var(--primary); }
        .stat-card:nth-child(2) .stat-icon { background: rgba(16,185,129,0.15); color: var(--success); }
        .stat-card:nth-child(3) .stat-icon { background: rgba(245,158,11,0.15); color: var(--warning); }
        .stat-card:nth-child(4) .stat-icon { background: rgba(239,68,68,0.15); color: var(--danger); }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-bright);
            line-height: 1;
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
        }

        /* ========== 主内容区 ========== */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 20px;
            padding: 0 32px 32px;
        }

        /* ========== 检测面板 ========== */
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .panel-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-bright);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title i {
            color: var(--primary);
            font-size: 18px;
        }

        .panel-body {
            padding: 20px;
        }

        /* ========== 区域选择 ========== */
        .area-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .area-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .area-chip:hover {
            border-color: var(--primary);
            color: var(--text);
        }

        .area-chip.active {
            background: rgba(59,130,246,0.12);
            border-color: var(--primary);
            color: var(--primary);
        }

        .area-chip input { display: none; }

        /* ========== 上传区 ========== */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 14px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            background: rgba(59,130,246,0.02);
        }

        .upload-zone:hover, .upload-zone.drag-over {
            border-color: var(--primary);
            background: rgba(59,130,246,0.06);
        }

        .upload-zone i {
            font-size: 36px;
            color: var(--primary);
            margin-bottom: 8px;
            display: block;
        }

        .upload-zone h3 {
            font-size: 16px;
            color: var(--text);
            margin-bottom: 6px;
        }

        .upload-zone p {
            font-size: 13px;
            color: var(--text-dim);
        }

        .upload-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-name {
            margin-top: 10px;
            font-size: 13px;
            color: var(--accent);
            min-height: 20px;
        }

        /* ========== 操作按钮 ========== */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .action-btn {
            padding: 14px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            color: white;
        }

        .action-btn i { font-size: 16px; }

        .btn-detect {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            box-shadow: 0 4px 14px rgba(37,99,235,0.3);
        }
        .btn-detect:hover { box-shadow: 0 6px 20px rgba(37,99,235,0.5); transform: translateY(-1px); }

        .btn-camera {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            box-shadow: 0 4px 14px rgba(220,38,38,0.3);
        }
        .btn-camera:hover { box-shadow: 0 6px 20px rgba(220,38,38,0.5); transform: translateY(-1px); }

        .btn-mobile {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            box-shadow: 0 4px 14px rgba(217,119,6,0.3);
        }
        .btn-mobile:hover { box-shadow: 0 6px 20px rgba(217,119,6,0.5); transform: translateY(-1px); }

        /* ========== 结果展示 ========== */
        .result-section {
            margin-top: 20px;
            display: none;
        }

        .result-section.show { display: block; }

        .result-media {
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            background: #000;
        }

        .result-media img, .result-media video {
            width: 100%;
            display: block;
        }

        .live-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--danger);
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
            animation: live-pulse 2s infinite;
        }

        .live-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }

        @keyframes live-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* ========== 右侧报告面板 ========== */
        .report-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
        }

        .report-list::-webkit-scrollbar { width: 4px; }
        .report-list::-webkit-scrollbar-track { background: transparent; }
        .report-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .report-item {
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
            transition: all 0.2s;
        }

        .report-item:hover {
            background: rgba(255,255,255,0.04);
        }

        .report-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .report-item-type {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-bright);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .report-item-conf {
            font-size: 12px;
            color: var(--accent);
            background: rgba(6,182,212,0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .report-item-bar {
            height: 3px;
            border-radius: 2px;
            background: var(--border);
            overflow: hidden;
        }

        .report-item-bar-fill {
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.6s ease;
        }

        .report-item.danger {
            border-color: rgba(239,68,68,0.3);
            background: rgba(239,68,68,0.05);
        }

        .report-item.danger .report-item-type { color: var(--danger); }
        .report-item.danger .report-item-bar-fill {
            background: linear-gradient(90deg, var(--danger), #f87171);
        }

        .report-safe {
            text-align: center;
            padding: 40px 20px;
            color: var(--success);
        }

        .report-safe i {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .report-safe p {
            font-size: 15px;
            font-weight: 500;
        }

        .close-btn {
            display: block;
            text-align: center;
            background: rgba(100,116,139,0.2);
            color: var(--text-dim);
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            margin-top: 16px;
            transition: all 0.2s;
            border: 1px solid var(--border);
        }

        .close-btn:hover {
            background: rgba(100,116,139,0.3);
            color: var(--text);
        }

        /* ========== 底部信息 ========== */
        .footer-bar {
            text-align: center;
            padding: 16px;
            color: var(--text-dim);
            font-size: 12px;
            border-top: 1px solid var(--border);
            margin-top: 16px;
        }

        .footer-bar span {
            color: var(--primary);
        }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state i {
            font-size: 56px;
            color: var(--border);
            margin-bottom: 16px;
            display: block;
        }

        .empty-state h3 {
            font-size: 16px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .empty-state p {
            font-size: 13px;
            color: var(--text-dim);
            opacity: 0.6;
            margin-top: 6px;
        }

        /* ========== 模型信息标签 ========== */
        .model-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(59,130,246,0.1);
            color: var(--primary);
            border: 1px solid rgba(59,130,246,0.2);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 1024px) {
            .main-content { grid-template-columns: 1fr; }
            .stats-row { flex-wrap: wrap; }
            .stat-card { flex: 1 1 calc(50% - 6px); min-width: 140px; }
        }

        @media (max-width: 640px) {
            .stats-row { padding: 12px 16px; }
            .stat-card { flex: 1 1 100%; }
            .main-content { padding: 0 16px 16px; gap: 12px; }
            .topbar { padding: 0 16px; }
            .action-buttons { grid-template-columns: 1fr; }
            .panel-body { padding: 16px; }
        }

        /* ========== 选择器增强 ========== */
        select:hover {
            border-color: var(--primary) !important;
        }
        select option {
            background: var(--bg-card);
            color: var(--text);
            padding: 8px;
        }

        /* ========== 全局面板阴影 ========== */
        .panel {
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
        }

        /* ========== 结果媒体区优化 ========== */
        .result-media {
            border-radius: 12px;
        }

        /* ========== 平滑过渡 ========== */
        .result-section, .report-list, .upload-zone {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 扫线动画 ========== */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: scan 3s linear infinite;
            z-index: 5;
            display: none;
        }

        .scan-line.active { display: block; }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* 加载动画 */
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- 顶栏 -->
    <div class="topbar">
        <div class="topbar-left">
            <div class="logo-icon"><i class="ri-shield-check-line"></i></div>
            <div>
                <div class="logo-text">Campus Guard AI</div>
                <div class="logo-sub">智能校园安全管理平台</div>
            </div>
        </div>
        <div class="topbar-right">
            <span class="model-tag"><i class="ri-cpu-line"></i> YOLOv11 + CBAM</span>
            <div class="status-indicator">
                <span class="status-dot"></span>
                系统运行中
            </div>
            <div class="time-display" id="clock"></div>
            <a href="/history"><i class="ri-history-line"></i> 历史</a>
            <div class="user-info"><i class="ri-user-3-line"></i> {{ username or 'admin' }}</div>
            <a href="/logout" style="color: var(--danger);"><i class="ri-logout-box-r-line"></i> 退出</a>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon"><i class="ri-eye-line"></i></div>
            <div class="stat-value" id="totalDetections">--</div>
            <div class="stat-label">检测目标总数</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="ri-checkbox-circle-line"></i></div>
            <div class="stat-value" id="normalCount">--</div>
            <div class="stat-label">正常状态区域</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="ri-alert-line"></i></div>
            <div class="stat-value" id="warningCount">--</div>
            <div class="stat-label">预警事件</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="ri-speed-line"></i></div>
            <div class="stat-value">97.8%</div>
            <div class="stat-label">模型 mAP50</div>
        </div>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <!-- 左侧：检测面板 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="ri-video-upload-line"></i>
                    安防检测工作台
                </div>

            </div>
            <div class="panel-body">
                <!-- 区域选择 -->
                <div style="margin-bottom: 18px;">
                    <label style="font-size: 13px; font-weight: 600; color: var(--text-dim); display: block; margin-bottom: 8px;">
                        <i class="ri-map-pin-line" style="color: var(--primary);"></i> 部署区域
                    </label>
                    <select name="area" style="width: 100%; padding: 10px 14px; font-size: 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text); cursor: pointer; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
                        <option value="lab">🔬 工程实验室</option>
                        <option value="gate">🚪 校门进出口 / 停车场</option>
                        <option value="dorm">🏠 宿舍区域</option>
                        <option value="corridor">🏫 教学楼走廊 / 消防通道</option>
                        <option value="playground" selected>🏟️ 操场 / 公共区域</option>
                    </select>
                </div>

                <!-- 上传区域 -->
                <form id="mainForm" method="POST" enctype="multipart/form-data">
                    <div class="upload-zone" id="uploadZone">
                        <i class="ri-upload-cloud-2-line"></i>
                        <h3>拖拽或点击上传</h3>
                        <p>支持 JPG / PNG / MP4 / AVI，最大 100MB</p>
                        <input type="file" name="file" accept="image/*, video/*" id="fileInput" onchange="handleFileSelect(this)">
                        <div class="file-name" id="fileName"></div>
                    </div>

                    <!-- 操作按钮 -->
                    <div class="action-buttons">
                        <button type="button" class="action-btn btn-detect" onclick="doDetect(); return false;">
                            <i class="ri-search-eye-line"></i>
                            <span>AI 智能检测</span>
                        </button>
                        <button type="button" class="action-btn btn-mobile" onclick="showLiveMonitor()">
                            <i class="ri-live-line"></i>
                            <span>实时监控</span>
                        </button>
                    </div>
                </form>

                <!-- AJAX 检测结果将动态插入此处 -->
            </div>
        </div>

        <!-- 右侧：检测报告 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="ri-file-list-3-line"></i>
                    检测报告
                </div>
                <span class="model-tag" id="reportStatus">待检测</span>
            </div>
            <div class="panel-body">
                <div class="report-list" id="reportPanel">
                    <div class="empty-state">
                        <i class="ri-search-eye-line"></i>
                        <h3>等待检测任务</h3>
                        <p>上传图片开始检测</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部 -->
    <div class="footer-bar">
        Campus Guard AI · <span>YOLOv11</span> 智能校园安全管理系统 · 南宁理工学院
    </div>

    <script>
        // 时钟
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                now.toLocaleDateString('zh-CN') + ' ' + now.toLocaleTimeString('zh-CN', {hour12: false});
        }
        updateClock();
        setInterval(updateClock, 1000);

        // 区域芯片切换
        function toggleChip(el) {
            const cb = el.querySelector('input');
            cb.checked = !cb.checked;
            el.classList.toggle('active', cb.checked);
        }

        // 文件选择显示
        function handleFileSelect(input) {
            const name = input.files[0]?.name || '';
            document.getElementById('fileName').textContent = name ? '📄 ' + name : '';
        }

        // 区域名映射
        const AREA_NAMES = {
            'lab': '🔬 工程实验室',
            'gate': '🚪 校门进出口',
            'dorm': '🏠 宿舍区域',
            'corridor': '🏫 教学楼走廊',
            'playground': '🏟️ 操场/公共区域'
        };

        // AI智能检测 - 支持图片和视频异步处理
        function doDetect() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) {
                alert('请先选择要检测的图片或视频');
                return;
            }

            const area = document.querySelector('select[name="area"]').value;
            var uploadZone = document.getElementById('uploadZone');
            uploadZone.innerHTML = '<div style="padding:40px;text-align:center;"><i class="ri-loader-4-line" style="font-size:40px;color:var(--primary);animation:spin 1s linear infinite;display:block;margin-bottom:12px;"></i><p style="color:var(--text);">正在AI检测中...</p><p id="progressText" style="font-size:13px;color:var(--text-dim);margin-top:6px;"></p></div>';
            document.getElementById('reportStatus').innerHTML = '<span style="color:var(--warning);">检测中...</span>';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('area', area);

            fetch('/detect', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        uploadZone.innerHTML = '<div style="padding:20px;text-align:center;color:var(--danger);">❌ ' + data.error + '</div>';
                        document.getElementById('reportStatus').innerHTML = '<span style="color:var(--danger);">错误</span>';
                        return;
                    }

                    // 图片：直接返回结果
                    if (data.file_type === 'image') {
                        showDetectionResult(data);
                        return;
                    }

                    // 视频：轮询任务进度
                    if (data.task_id) {
                        pollTaskStatus(data.task_id);
                    }
                })
                .catch(e => {
                    uploadZone.innerHTML = '<div style="padding:20px;text-align:center;color:var(--danger);">错误: ' + e.message + '</div>';
                    document.getElementById('reportStatus').innerHTML = '<span style="color:var(--danger);">错误</span>';
                });
        }

        // 轮询视频处理进度
        function pollTaskStatus(taskId) {
            const interval = setInterval(() => {
                fetch('/task_status/' + taskId)
                    .then(r => r.json())
                    .then(data => {
                        const pt = document.getElementById('progressText');
                        if (pt) pt.textContent = '处理进度: ' + (data.progress || 0) + '%';

                        if (data.status === 'done') {
                            clearInterval(interval);
                            showDetectionResult(data);
                        } else if (data.status === 'error') {
                            clearInterval(interval);
                            document.getElementById('uploadZone').innerHTML = '<div style="padding:20px;text-align:center;color:var(--danger);">❌ 处理失败: ' + data.error + '</div>';
                            document.getElementById('reportStatus').innerHTML = '<span style="color:var(--danger);">错误</span>';
                        }
                    })
                    .catch(() => {});
            }, 1000);
        }

        // 显示检测结果
        function showDetectionResult(data) {
            const uploadZone = document.getElementById('uploadZone');
            let mediaHtml = '';
            if (data.file_type === 'image') {
                mediaHtml = '<img src="/static/results/' + data.result_file + '" style="width:100%;border-radius:8px;">';
            } else {
                mediaHtml = '<video controls autoplay loop muted style="width:100%;border-radius:8px;"><source src="/static/results/' + data.result_file + '" type="video/mp4"></video>';
            }
            uploadZone.innerHTML = '<div style="text-align:center;"><h3 style="margin:0 0 10px;color:var(--success);">✅ 检测完成</h3>' + mediaHtml + '</div>';

            // 更新报告面板
            var panelBody = document.querySelectorAll('.panel .panel-body')[1];
            if (panelBody && data.detected_items) {
                if (data.detected_items.length > 0) {
                    let html = '<div class="report-list">';
                    data.detected_items.forEach(item => {
                        let danger = item.type.includes('违规') || item.type.includes('警报') || item.type.includes('缺失');
                        html += '<div class="report-item ' + (danger ? 'danger' : '') + '">' +
                            '<div class="report-item-header"><div class="report-item-type"><i class="' + (danger ? 'ri-error-warning-line' : 'ri-checkbox-circle-line') + '"></i> ' + item.type + '</div>' +
                            '<span class="report-item-conf">' + (item.confidence || '动态捕获') + '</span></div>' +
                            '<div class="report-item-bar"><div class="report-item-bar-fill" style="width:' + (danger ? '95' : '75') + '%;"></div></div></div>';
                    });
                    html += '</div>';
                    panelBody.innerHTML = html;
                } else {
                    panelBody.innerHTML = '<div class="report-safe"><i class="ri-shield-check-line"></i><p>画面安全，未检测到异常目标</p></div>';
                }
                document.getElementById('reportStatus').innerHTML = '<span style="color:var(--success);">已完成</span>';
            }

            // 更新统计
            if (data.detected_items) {
                document.getElementById('totalDetections').textContent = data.detected_items.length;
                let warnings = 0;
                data.detected_items.forEach(item => {
                    if (item.type.includes('违规') || item.type.includes('警报') || item.type.includes('缺失')) warnings++;
                });
                document.getElementById('warningCount').textContent = warnings;
                document.getElementById('normalCount').textContent = Math.max(0, 8 - warnings);
            }
        }

        // 拖拽上传
        const zone = document.getElementById('uploadZone');
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
        zone.addEventListener('drop', e => {
            e.preventDefault();
            zone.classList.remove('drag-over');
            const input = document.getElementById('fileInput');
            input.files = e.dataTransfer.files;
            handleFileSelect(input);
        });

        // 初始化统计卡片
        document.getElementById('totalDetections').textContent = '0';
        document.getElementById('normalCount').textContent = '8';
        document.getElementById('warningCount').textContent = '0';

    </script>

    <!-- 实时监控容器（默认隐藏，替换上传区域） -->
    <div id="liveMonitorContainer" style="display:none; opacity:0; transition: opacity 0.4s ease-out;">
        <h2 style="margin:0 0 15px;">📹 实时监控</h2>
        <button type="button" onclick="startLiveCam(); return false;" class="action-btn" style="background:#3b82f6;padding:12px 20px;color:#fff;border:none;border-radius:8px;cursor:pointer" id=startBtn>▶ 开启实时监控</button>
        <button type="button" onclick="stopLiveCam(); return false;" class="action-btn" style="background:#6b7280;padding:12px 20px;color:#fff;border:none;border-radius:8px;cursor:pointer;display:none" id=stopBtn>⏹ 停止</button>
        <div id="liveStatus" style="margin:10px 0;"></div>
        <div style="display:flex;gap:10px;margin-top:10px;">
            <video id="liveVideo" autoplay playsinline style="width:50%;display:none;"></video>
            <img id="liveResult" style="width:50%;display:none;">
        </div>
        <canvas id="liveCanvas" style="display:none;"></canvas>
        <script>
        let liveStream=null;
        function showLiveMonitor(){
            if(location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                alert('⚠️ 实时监控需要 HTTPS 访问！\n\n当前地址: ' + location.href + '\n\n请使用 https:// 开头的地址访问。');
                return;
            }
            var uploadZone = document.getElementById('uploadZone');
            var liveContainer = document.getElementById('liveMonitorContainer');
            if(uploadZone && liveContainer) {
                var parent = uploadZone.parentNode;
                parent.insertBefore(liveContainer, uploadZone);
                uploadZone.style.display = 'none';
                liveContainer.style.display = 'block';
                setTimeout(function() {
                    liveContainer.style.opacity = '1';
                    startLiveCam();
                }, 50);
            }
        }
        function startLiveCam(){
            document.getElementById("startBtn").style.display="none";
            document.getElementById("stopBtn").style.display="inline-block";
            document.getElementById("liveStatus").innerHTML="🚀 请求摄像头权限...";
            if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
                document.getElementById("liveStatus").innerHTML='<div style="color:#ef4444;padding:16px;background:rgba(239,68,68,0.1);border-radius:10px;border:1px solid rgba(239,68,68,0.3);">❌ 浏览器不支持摄像头 API<br><br><b>原因：</b>当前使用 HTTP 协议访问，浏览器禁止在非安全上下文中使用摄像头。<br><br><b>解决方案：</b><br>1. 使用 https:// 开头的地址访问本系统<br>2. 如果是自签名证书，浏览器会提示"不安全"，点"高级"→"继续前往"即可<br><br>当前地址: <code style="color:#06b6d4;">'+location.href+'</code></div>';
                document.getElementById("startBtn").style.display="inline-block";
                document.getElementById("stopBtn").style.display="none";
                return;
            }
            navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280}}}).then(function(s){
                liveStream=s;
                document.getElementById("liveVideo").srcObject=s;
                document.getElementById("liveVideo").style.display="block";
                document.getElementById("liveStatus").innerHTML="<div style=color:#10b981>✅ 摄像头已启动</div>";
                processLiveFrame();
            }).catch(function(e){
                document.getElementById("liveStatus").innerHTML="<div style=color:#ef4444>❌ "+e.name+": "+e.message+"</div>";
                document.getElementById("startBtn").style.display="inline-block";
                document.getElementById("stopBtn").style.display="none";
            });
        }
        function stopLiveCam(){
            if(liveStream){
                liveStream.getTracks().forEach(function(t){t.stop()});
                liveStream=null;
            }
            document.getElementById("liveVideo").style.display="none";
            document.getElementById("liveResult").style.display="none";
            document.getElementById("stopBtn").style.display="none";
            document.getElementById("startBtn").style.display="inline-block";
            document.getElementById("liveStatus").innerHTML="已停止";
        }
        function processLiveFrame(){
            if(!liveStream||liveStream.getTracks().length===0) return;
            var v=document.getElementById("liveVideo");
            var c=document.getElementById("liveCanvas");
            if(v.readyState!==4){
                requestAnimationFrame(processLiveFrame);
                return;
            }
            c.width=v.videoWidth;
            c.height=v.videoHeight;
            var cx=c.getContext("2d");
            cx.drawImage(v,0,0,c.width,c.height);
            var md=Math.max(c.width,c.height),sc=640/md,tc=c;
            if(md>640){tc=document.createElement("canvas");tc.width=Math.round(c.width*sc);tc.height=Math.round(c.height*sc);tc.getContext("2d").drawImage(c,0,0,tc.width,tc.height);}
            var dataURL=tc.toDataURL("image/jpeg",0.5);
            fetch("/detect_web_frame",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({image:dataURL,areas:document.querySelector('select[name="area"]').value||"playground"})
            }).then(function(r){return r.json()}).then(function(data){
                if(data.image){
                    document.getElementById("liveResult").src=data.image;
                    document.getElementById("liveResult").style.display="block";
                }
                setTimeout(processLiveFrame, 200);
            }).catch(function(){
                setTimeout(processLiveFrame, 500);
            });
        }
        </script>
    </div>


</body>
