<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="font-family:sans-serif;padding:20px;">
<h2>摄像头调试</h2>
<button onclick="test()" style="padding:15px 30px;font-size:18px;">点击测试摄像头</button>
<br><br>
<div id="out"></div>
<video id="v" autoplay playsinline style="width:100%;max-width:400px;display:none;"></video>
<script>
function test(){
var out=document.getElementById("out");
out.innerHTML='开始请求摄像头...';
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
out.innerHTML='错误: 浏览器不支持getUserMedia<br>请使用Chrome/Safari';
return
}
navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(s){
document.getElementById("v").srcObject=s;
document.getElementById("v").style.display='block';
out.innerHTML='✅ 摄像头已启动！';
}).catch(function(e){
out.innerHTML='❌ 错误: '+e.name+' - '+e.message;
});
}
</script>
</body>
</html>
